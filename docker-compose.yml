services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crewai}
      POSTGRES_USER: ${POSTGRES_USER:-crewai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_SKILL_BUCKET: ${S3_SKILL_BUCKET:-agent-skills}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing "local/$${S3_SKILL_BUCKET}"

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  # A separate daemon keeps the application container from needing the host
  # Docker socket. The skill workspace is shared with the daemon so bind mounts
  # created by DockerSkillSandbox resolve inside the daemon's filesystem.
  docker:
    image: docker:27.3.1-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker_data:/var/lib/docker
      - skill_workspace:/skill-workspace
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30

  sandbox-image-init:
    image: docker:27.3.1-cli
    restart: "no"
    depends_on:
      docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker:2375
    command: ["docker", "pull", "python:3.12.7-slim"]

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "database.bootstrap"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-crewai_telegrambot}
      ENV: ${ENV:-docker}
      DEBUG: ${DEBUG:-false}
      ECHO: ${ECHO:-false}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?Set TELEGRAM_TOKEN in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379/0
      VLLM_URL: ${VLLM_URL:?Set VLLM_URL in .env}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_MODEL: ${VLLM_MODEL:?Set VLLM_MODEL in .env}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SKILL_BUCKET: ${S3_SKILL_BUCKET:-agent-skills}
      S3_USE_SSL: "false"
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_MEMORY_COLLECTION: ${QDRANT_MEMORY_COLLECTION:-agent_memory}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      DOCKER_HOST: tcp://docker:2375
      TMPDIR: /skill-workspace
      CREWAI_APPROVAL_PERSISTENCE_PATH: /app/.crewai/flow_states.db
      SKILL_SANDBOX_PYTHON_IMAGE: python:3.12.7-slim
      SKILL_SANDBOX_TIMEOUT_SECONDS: ${SKILL_SANDBOX_TIMEOUT_SECONDS:-30}
      SKILL_SANDBOX_MEMORY_MB: ${SKILL_SANDBOX_MEMORY_MB:-256}
      SKILL_SANDBOX_CPUS: ${SKILL_SANDBOX_CPUS:-0.5}
      SKILL_SANDBOX_PIDS_LIMIT: ${SKILL_SANDBOX_PIDS_LIMIT:-64}
      SKILL_SANDBOX_MAX_STDOUT_BYTES: ${SKILL_SANDBOX_MAX_STDOUT_BYTES:-262144}
      SKILL_SANDBOX_MAX_STDERR_BYTES: ${SKILL_SANDBOX_MAX_STDERR_BYTES:-262144}
    user: "10001:10001"
    volumes:
      - crewai_state:/app/.crewai
      - skill_workspace:/skill-workspace
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      docker:
        condition: service_healthy
      sandbox-image-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  docker_data:
  skill_workspace:
  crewai_state:
